name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet==0.83.1 flet-cli==0.83.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: false  # ⚠️ ОТКЛЮЧАЕМ КЭШ ДЛЯ ЧИСТОЙ СБОРКИ

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

        # --- ПРИНУДИТЕЛЬНАЯ ОЧИСТКА ---
      - name: Clean Flet & Flutter cache
        run: |
          flet clean
          flutter clean
          rm -rf .dart_tool/ .flutter-plugins* pubspec.lock
        shell: bash

      - name: Build APK
        run: flet build apk --verbose
      
      - name: Check APK App Label
        run: |
          APK_PATH=$(find build -name "app-release.apk" | head -n 1)
          echo "📦 Extracting app label from APK..."
          unzip -p "$APK_PATH" AndroidManifest.xml | strings | grep -i "application-label" || true
          # Альтернативный способ через aapt (если доступен)
          $ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep application-label || true
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk