name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet==0.83.1 flet-cli==0.83.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: false  # ⚠️ ОТКЛЮЧАЕМ КЭШ ДЛЯ ЧИСТОЙ СБОРКИ

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: 🔍 Verify flet.toml & Generated Config
        run: |
          echo "=== 1. flet.toml exists? ==="
          ls -la flet.toml || echo "FILE NOT FOUND!"
          
          echo "=== 2. flet.toml content (hex check for BOM) ==="
          hexdump -C flet.toml | head -n 5
          
          echo "=== 3. Python TOML parse test ==="
          python3 -c "
          import tomllib
          try:
              with open('flet.toml', 'rb') as f:
                  cfg = tomllib.load(f)
              print('✅ Parsed OK')
              print('app_name:', cfg.get('build', {}).get('android', {}).get('app_name', 'MISSING'))
              print('package_name:', cfg.get('build', {}).get('android', {}).get('package_name', 'MISSING'))
          except Exception as e:
              print('❌ Parse Error:', e)
          "
        shell: bash

        # --- ПРИНУДИТЕЛЬНАЯ ОЧИСТКА ---
      - name: Hard Clean
        run: |
          rm -rf build/ .flet/ .dart_tool/ __pycache__/
          rm -rf pubspec.lock .flutter-plugins* flet_server.log
          # Критично: удаляем скрытый кэш Flet CLI
          rm -rf ~/.flet/
          flutter pub cache clean 2>/dev/null || true
        shell: bash

      - name: Build APK
        run: flet build apk --verbose
      
      - name: Verify APK Label
        run: |
          APK=$(find build -name "app-release.apk" | head -n 1)
          echo "📦 APK: $APK"
          # Flet хранит имя в strings.xml
          unzip -p "$APK" res/values/strings.xml 2>/dev/null | grep -A1 'app_name' || echo "Not found"
          # Дубликат в манифесте
          unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep 'application-label' || echo "Not found"
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk