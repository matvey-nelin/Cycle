name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      # Подавляем интерактивные запросы в CI
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet==0.83.1 flet-cli==0.83.1

      - name: Set up Flutter (версия, которую требует Flet)
        uses: subosito/flutter-action@v2
        with:
          # ⚠️ Ставим именно ту версию, которую просит лог ошибки:
          flutter-version: '3.41.4'
          channel: 'stable'
          # Это важно: не переключать канал автоматически
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-deploy-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk