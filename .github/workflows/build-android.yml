name: Build Android APK
on: [workflow_dispatch]  # Запуск вручную

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Flet
        run: pip install flet==0.83.1 flet-cli==0.83.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.0', channel: 'stable' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses
      - name: Build APK
        run: flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-deploy-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk