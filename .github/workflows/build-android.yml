name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & CLI
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true  # ✅ Включаем кэш: ускоряет CI, Flet сам контролирует чистоту сборки

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools (для aapt)
        run: sdkmanager "build-tools;34.0.0" > /dev/null 2>&1

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: 🔍 Verify flet.toml structure
        run: |
          python3 -c "
          import tomllib
          with open('flet.toml', 'rb') as f:
              cfg = tomllib.load(f)
          print('✅ TOML parsed successfully')
          print(f'📱 App name: {cfg.get(\"app\", {}).get(\"name\", \"MISSING\")}')
          print(f'📦 Package: {cfg.get(\"build\", {}).get(\"android\", {}).get(\"package\", \"MISSING\")}')
          print(f'🔢 Version: {cfg.get(\"app\", {}).get(\"version\", \"1.0.0\")}')
          "
        shell: bash

      # ❌ Удалён "Hard Clean". Flet CLI сам управляет кэшем.
      # Агрессивное удаление ~/.flet/ и pub cache ломает генерацию pubspec.yaml.
      # Если нужна чистка, используйте: flet build clean

      - name: Build APK
        run: flet build apk --verbose

      - name: Verify APK Metadata
        run: |
          # Ищем APK по стандартным путям Flet/Flutter
          APK=$(find . -path "./build/flutter/build/app/outputs/flutter-apk/app-release.apk" \
                       -o -path "./build/app/outputs/flutter-apk/app-release.apk" | head -n 1)
          
          if [ -z "$APK" ]; then
            echo "❌ APK not found after build!"
            exit 1
          fi
          echo "📦 APK found: $APK"
          
          AAPT=$(find $ANDROID_HOME -name "aapt" -type f 2>/dev/null | head -n 1)
          if [ -n "$AAPT" ]; then
            echo "✅ Checking metadata with aapt..."
            "$AAPT" dump badging "$APK" | grep -E "application-label|package: name" || echo "⚠️ aapt dump returned no matches"
          else
            echo "ℹ️ aapt not in PATH. Metadata is compiled into resources.arsc (normal for release)."
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-apk
          path: |
            build/flutter/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error