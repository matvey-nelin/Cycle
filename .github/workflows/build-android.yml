name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: false  # ⚠️ ОТКЛЮЧАЕМ КЭШ ДЛЯ ЧИСТОЙ СБОРКИ

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: 🔍 Verify flet.toml & Generated Config
        run: |
          echo "=== 1. flet.toml exists? ==="
          ls -la flet.toml || echo "FILE NOT FOUND!"
          
          echo "=== 2. flet.toml content (hex check for BOM) ==="
          hexdump -C flet.toml | head -n 5
          
          echo "=== 3. Python TOML parse test ==="
          python3 -c "
          import tomllib
          try:
              with open('flet.toml', 'rb') as f:
                  cfg = tomllib.load(f)
              print('✅ Parsed OK')
              print('app_name:', cfg.get('build', {}).get('android', {}).get('app_name', 'MISSING'))
              print('package_name:', cfg.get('build', {}).get('android', {}).get('package_name', 'MISSING'))
          except Exception as e:
              print('❌ Parse Error:', e)
          "
        shell: bash

        # --- ПРИНУДИТЕЛЬНАЯ ОЧИСТКА ---
      - name: Hard Clean
        run: |
          rm -rf build/ .flet/ .dart_tool/ __pycache__/
          rm -rf pubspec.lock .flutter-plugins* flet_server.log
          # Критично: удаляем скрытый кэш Flet CLI
          rm -rf ~/.flet/
          flutter pub cache clean 2>/dev/null || true
        shell: bash

      - name: Build APK
        run: flet build apk --verbose
        
      - name: Verify APK Metadata
        run: |
          APK=$(find build -name "app-release.apk" | head -n 1)
          echo "📦 APK: $APK"
          
          # 1. Пытаемся найти aapt в Android SDK
          AAPT=$(find $ANDROID_HOME -name "aapt" -type f 2>/dev/null | head -n 1)
          
          if [ -n "$AAPT" ]; then
            echo "✅ Using aapt for metadata dump"
            "$AAPT" dump badging "$APK" | grep -E "application-label|package: name"
          else
            echo "⚠️ aapt not found in PATH. Fallback to manifest strings check."
            # В релизных сборках label часто хранится как ссылка на resources.arsc
            unzip -p "$APK" AndroidManifest.xml | strings | grep -oP "application-label='[^']*'" || \
            echo "✅ Metadata is compiled in resources.arsc (standard for release builds)"
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-apk
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk