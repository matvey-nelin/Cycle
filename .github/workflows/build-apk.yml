name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & CLI
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true  # ✅ Включаем кэш: ускоряет CI

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools (для aapt)
        run: sdkmanager "build-tools;34.0.0" > /dev/null 2>&1


      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Decode Keystore & Auto-Increment Build Number
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > cycle-release.jks
          sed -i "s/build_number = .*/build_number = $BUILD_NUMBER/" pyproject.toml
          echo "✅ Build number: $BUILD_NUMBER"
        shell: bash

      - name: Hard clean build artifacts
        run: |
          rm -rf build/ .flet/ .dart_tool/ __pycache__/
          rm -rf pubspec.lock .flutter-plugins* flet_server.log
        shell: bash

      - name: Build Release APK
        run: |
          flet build apk \
            --build-type release \
            --android-signing-key-store cycle-release.jks \
            --android-signing-key-store-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --android-signing-key-alias "${{ secrets.KEY_ALIAS }}" \
            --android-signing-key-password "${{ secrets.KEY_PASSWORD }}" \
            --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cycle-v${{ github.run_number }}
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk