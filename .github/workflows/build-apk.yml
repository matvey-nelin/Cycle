name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & CLI
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools
        run: sdkmanager "build-tools;34.0.0" > /dev/null 2>&1      

      - name: Hard clean build artifacts
        run: |
          rm -rf build/ .flet/ .dart_tool/ __pycache__/
          rm -rf pubspec.lock .flutter-plugins* flet_server.log
        shell: bash

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > cycle-release.jks
        shell: bash

      - name: Build & Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Удаляем key.properties, чтобы Flet использовал только переданные флаги
          rm -f key.properties
          
          # 🔑 ИСПОЛЬЗУЕМ АБСОЛЮТНЫЙ ПУТЬ ($GITHUB_WORKSPACE)
          # Gradle ищет ключ относительно android/app/, поэтому относительный путь ломается в CI.
          # Абсолютный путь гарантирует, что файл будет найден на 100%.
          flet build apk \
            --build-number $BUILD_NUMBER \
            --android-signing-key-store "$GITHUB_WORKSPACE/cycle-release.jks" \
            --android-signing-key-store-password "$KEYSTORE_PASSWORD" \
            --android-signing-key-alias "$KEY_ALIAS" \
            --android-signing-key-password "$KEY_PASSWORD" \
            --verbose
        shell: bash

      - name: Verify APK Metadata
        run: |
          echo "🔍 Checking APK info..."
          AAPT=$ANDROID_HOME/build-tools/34.0.0/aapt
          APK_PATH="build/apk/cycle.apk"
          
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found: $APK_PATH"
            $AAPT dump badging "$APK_PATH" | grep -E "package: name=|versionCode=|versionName=|application-label:"
          else
            echo "❌ APK not found at $APK_PATH"
            echo "Available files in build/apk:"
            ls -la build/apk/
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cycle-v${{ github.run_number }}
          path: build/apk/cycle.apk