name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & CLI
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true  # ✅ Включаем кэш: ускоряет CI

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools (для aapt)
        run: sdkmanager "build-tools;34.0.0" > /dev/null 2>&1

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: 🔍 Verify pyproject.toml structure
        run: |
          python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              cfg = tomllib.load(f)
          print('✅ TOML parsed successfully')
          print(f'📱 Product: {cfg.get(\"tool\", {}).get(\"flet\", {}).get(\"product\", \"MISSING\")}')
          print(f'📦 Package: {cfg.get(\"tool\", {}).get(\"flet\", {}).get(\"android\", {}).get(\"package\", \"MISSING\")}')
          print(f'🔢 Version: {cfg.get(\"project\", {}).get(\"version\", \"1.0.0\")}')
          print(f'🔢 Build #: {cfg.get(\"tool\", {}).get(\"flet\", {}).get(\"android\", {}).get(\"build_number\", \"MISSING\")}')
          "
        shell: bash

      - name: Hard Clean
        run: |
          echo "🧹 Cleaning build directories and Flet global cache..."
          rm -rf build/
          rm -rf .flet/
          # КРИТИЧНО: Удаляем кэш сгенерированных шаблонов
          rm -rf ~/.flet/ 
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        shell: bash

      - name: Build APK
        run: flet build apk --verbose
      
      - name: Verify APK Metadata
        run: |
          # Flet CLI формирует имя APK на основе [tool.flet].product
          APK="./build/apk/Cycle.apk"
          
          if [ ! -f "$APK" ]; then
            # Фоллбэк: ищем любой APK в папке, если имя изменится
            APK=$(find ./build/apk -name "*.apk" | head -n 1)
            if [ -z "$APK" ]; then
              echo "❌ APK not found in build/apk/"
              exit 1
            fi
          fi
          echo "📦 APK found: $APK"
          
          AAPT=$(find $ANDROID_HOME -name "aapt" -type f 2>/dev/null | head -n 1)
          if [ -n "$AAPT" ]; then
            echo "✅ Checking metadata with aapt..."
            "$AAPT" dump badging "$APK" | grep -E "application-label|package: name"
          else
            echo "ℹ️ aapt not found. Skipping metadata dump."
          fi
        shell: bash

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cycle-apk
          path: build/apk/Cycle.apk
          if-no-files-found: error