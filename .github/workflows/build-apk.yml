name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: "noninteractive"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & CLI
        run: pip install flet==0.85.1 flet-cli==0.85.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true  # ✅ Включаем кэш: ускоряет CI

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools (для aapt)
        run: sdkmanager "build-tools;34.0.0" > /dev/null 2>&1


      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Setup Keystore & Auto-Increment Build Number
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # 1. Декодируем ключ
          echo "$KEYSTORE_BASE64" | base64 -d > cycle-release.jks
          
          # 2. Создаём key.properties (Flet сам переключится в Release Mode)
          cat > key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=cycle-release.jks
          EOF
          
          # 3. Автоинкремент версии
          sed -i "s/build_number = .*/build_number = $BUILD_NUMBER/" pyproject.toml
          echo "✅ BuildNumber: $BUILD_NUMBER | key.properties created"
        shell: bash

      - name: Hard clean build artifacts
        run: |
          rm -rf build/ .flet/ .dart_tool/ __pycache__/
          rm -rf pubspec.lock .flutter-plugins* flet_server.log
        shell: bash

      - name: Build APK
        run: flet build apk --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cycle-v${{ github.run_number }}
          path: build/flutter/build/app/outputs/flutter-apk/app-release.apk